---
layout: default
---

<article class="container mx-auto px-6 max-w-3xl animate-fade-in-up">

    <header class="mb-12 text-center border-b border-slate-900 pb-10">
        <div class="flex items-center justify-center gap-2 mb-4">
            <span
                class="bg-orange-600/20 text-orange-500 border border-orange-500/30 px-3 py-1 text-xs font-bold uppercase tracking-wider rounded-full">
                Artigo
            </span>
        </div>

        <h1 class="text-3xl md:text-5xl font-extrabold text-white leading-tight mb-6">
            {{ page.title }}
        </h1>

        <div class="flex items-center justify-center gap-4 text-sm text-slate-400 font-mono">
            <span class="flex items-center gap-1.5">
                <i data-lucide="calendar" class="w-4 h-4"></i>
                {{ page.date | date: "%d/%m/%Y" }}
            </span>
            <span class="flex items-center gap-1.5">
                <i data-lucide="clock" class="w-4 h-4"></i>
                5 min de leitura
            </span>
        </div>
    </header>

    <div class="prose prose-invert prose-orange max-w-none text-lg leading-relaxed text-slate-300">
        {{ content }}
    </div>

    <div class="mt-16 pt-8 border-t border-slate-900 text-center">
        <a href="/"
            class="inline-flex items-center gap-2 text-slate-400 hover:text-orange-500 transition-colors font-medium">
            <i data-lucide="arrow-left" class="w-4 h-4"></i>
            Voltar para a página inicial
        </a>
    </div>

</article>
