<!DOCTYPE html>
<html lang="pt-BR" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ page.title | default: site.title }}</title>
    <link rel="icon" type="image/x-icon" href="/assets/images/global/svgviewer-output.ico">

    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    typography: (theme) => ({
                        DEFAULT: {
                            css: {
                                color: theme('colors.slate.300'),
                                a: { color: theme('colors.orange.500'), '&:hover': { color: theme('colors.orange.400') } },
                                h1: { color: theme('colors.white') },
                                h2: { color: theme('colors.white') },
                                h3: { color: theme('colors.white') },
                                strong: { color: theme('colors.white') },
                                code: { color: theme('colors.orange.400') },
                                blockquote: {
                                    borderLeftColor: theme('colors.orange.500'),
                                    color: theme('colors.slate.400')
                                },
                            },
                        },
                    }),
                }
            }
        }
    </script>

    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <!-- Arquivo CSS Personalizado -->
    <link rel="stylesheet" href="/assets/css/style.css">
</head>

<body class="min-h-screen bg-slate-950 text-slate-200 font-sans flex flex-col">

    <nav id="navbar" class="fixed top-0 w-full z-50 transition-all duration-300 py-6 bg-transparent">
        <div class="container mx-auto px-6 flex justify-between items-center">
            <div class="text-2xl font-bold tracking-tighter text-white">

                    <a href="/#expertise" class="hover:text-orange-500 transition-colors">EXPERTISE</a>

                    <a href="/blog" class="hover:text-orange-500 transition-colors">BLOG</a>
                    <a href="/#contact"
                        class="px-5 py-2 border border-orange-500 text-orange-500 rounded hover:bg-orange-500 hover:text-white transition-all">CONTATO</a>
                </div>

                <div class="relative group">
                    <button class="flex items-center gap-1 text-slate-300 hover:text-white transition-colors">
                        <i data-lucide="globe" class="w-5 h-5"></i>
                        <i data-lucide="chevron-down" class="w-3 h-3"></i>
                    </button>
                    <div
                        class="absolute right-0 mt-4 w-40 bg-slate-800 rounded-md shadow-xl border border-slate-700 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-300 transform origin-top-right">
                        <a href="index.html"
                            class="block px-4 py-2 text-sm text-orange-500 font-bold hover:bg-slate-700 rounded-t-md">Português
                            (BR)</a>
                        <a href="/en.html"
                            class="block px-4 py-2 text-sm text-slate-300 hover:bg-slate-700 hover:text-white rounded-b-md">English
                            (US)</a>

                </div>
            </div>
        </div>
    </nav>

    <main class="flex-grow pt-32 pb-24 container mx-auto px-6 flex relative items-start">
        <div class="w-full lg:w-3/4 pr-0 lg:pr-16 prose prose-invert prose-orange max-w-none" id="main-content">
            {{ content }}
        </div>

        <aside class="hidden lg:block w-1/4 sticky top-32">
            <div class="border-l-2 border-slate-800 pl-5 py-2" id="toc-container">
                <p class="text-sm font-bold text-slate-200 mb-5  tracking-wider">Nesta página</p>
                <nav>
                    <ul id="toc-list" class="space-y-3 text-sm text-slate-400">
                    </ul>
                </nav>
            </div>
        </aside>
    </main>

        </div>

    <script src="/assets/js/script.js"></script>
