<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#fb923c"/>
    </linearGradient>

    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.8" opacity="0.4"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>

  <!-- Ambient background glow circles -->
  <circle cx="200" cy="150" r="220" fill="#ea580c" opacity="0.12" filter="blur(60px)"/>
  <circle cx="980" cy="450" r="250" fill="#0284c7" opacity="0.12" filter="blur(70px)"/>

  <!-- Top Badge -->
  <g transform="translate(100, 95)">
    <rect width="220" height="34" rx="17" fill="#ea580c" fill-opacity="0.15" stroke="#ea580c" stroke-width="1.2"/>
    <circle cx="18" cy="17" r="4.5" fill="#f97316"/>
    <text x="32" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#fb923c" letter-spacing="2">CYBERSECURITY RESEARCH</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="58" font-weight="900" fill="#ffffff" letter-spacing="-1">
    TIMING ATTACKS:
  </text>
  <text x="100" y="265" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" fill="url(#orangeGrad)" letter-spacing="-0.5">
    O Vazamento Invisível em APIs
  </text>

  <!-- Subtitle -->
  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="21" font-weight="400" fill="#94a3b8">
    Como diferenças de microssegundos em comparações revelam segredos criptográficos.
  </text>

  <!-- Oscilloscope / Pulse Visual Graphic -->
  <g transform="translate(100, 375)">
    <!-- Panel Background -->
    <rect width="1000" height="175" rx="14" fill="#0b1120" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Waveform axes -->
    <line x1="40" y1="135" x2="960" y2="135" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4"/>
    <text x="40" y="32" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="13" font-weight="600" fill="#64748b">CH1: CPU EXECUTION DELAY (Δt)</text>
    <text x="860" y="32" font-family="'JetBrains Mono', monospace" font-size="13" font-weight="600" fill="#f97316">EARLY EXIT</text>

    <!-- Signal path with step delays -->
    <path d="M 50 135 L 180 135 L 180 105 L 220 105 L 220 135 L 360 135 L 360 80 L 400 80 L 400 135 L 540 135 L 540 55 L 580 55 L 580 135 L 720 135 L 720 30 L 760 30 L 760 135 L 950 135" 
          fill="none" stroke="url(#orangeGrad)" stroke-width="3" filter="url(#glow)"/>

    <!-- Data markers -->
    <g transform="translate(180, 105)">
      <circle cx="20" cy="0" r="4" fill="#f97316"/>
      <text x="20" y="-12" font-family="monospace" font-size="11" fill="#fdba74" text-anchor="middle">char[0] ✓</text>
    </g>

    <g transform="translate(360, 80)">
      <circle cx="20" cy="0" r="4" fill="#f97316"/>
      <text x="20" y="-12" font-family="monospace" font-size="11" fill="#fdba74" text-anchor="middle">char[1] ✓</text>
    </g>

    <g transform="translate(540, 55)">
      <circle cx="20" cy="0" r="4" fill="#f97316"/>
      <text x="20" y="-12" font-family="monospace" font-size="11" fill="#fdba74" text-anchor="middle">char[2] ✓</text>
    </g>

    <g transform="translate(720, 30)">
      <circle cx="20" cy="0" r="4" fill="#f97316"/>
      <text x="20" y="-12" font-family="monospace" font-size="11" fill="#4ade80" text-anchor="middle">TOKEN PWNED</text>
    </g>

    <!-- Bottom Legend -->
    <text x="50" y="158" font-family="monospace" font-size="12" fill="#64748b">Tentativa 1: "A___" (t₀)</text>
    <text x="240" y="158" font-family="monospace" font-size="12" fill="#64748b">Tentativa 2: "S___" (t₀ + Δt)</text>
    <text x="470" y="158" font-family="monospace" font-size="12" fill="#64748b">Tentativa 3: "SE__" (t₀ + 2Δt)</text>
    <text x="730" y="158" font-family="monospace" font-size="12" fill="#4ade80">Match Completo (t₀ + 3Δt)</text>
  </g>

  <!-- Author Tag in bottom right -->
  <text x="1100" y="595" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569" text-anchor="end">
    Herton Silveira • hertonnn.github.io
  </text>
</svg>
