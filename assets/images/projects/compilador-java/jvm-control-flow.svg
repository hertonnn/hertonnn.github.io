<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 310" width="100%" height="100%">
  <rect width="680" height="310" fill="#ffffff"/>

  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#334155"/>
    </marker>
  </defs>

  <!-- Node 1: Init -->
  <rect x="220" y="18" width="220" height="36" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="330" y="34" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">init' (ex: i = 0)</text>
  <text x="330" y="47" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">iconst_0 ; istore 1</text>

  <line x1="330" y1="54" x2="330" y2="76" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node 2: Condition (lInicio) -->
  <text x="208" y="96" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">lInicio:</text>
  <rect x="220" y="78" width="220" height="40" rx="2" fill="#f8fafc" stroke="#0f172a" stroke-width="1.3"/>
  <text x="330" y="95" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">cond' (ExprL)</text>
  <text x="330" y="110" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">if_icmplt lTrue ; goto lFim</text>

  <line x1="330" y1="118" x2="330" y2="144" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="340" y="135" font-family="serif" font-style="italic" font-size="10.5" fill="#334155">verdadeiro</text>

  <!-- Node 3: Body (lTrue) -->
  <text x="208" y="164" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">lTrue:</text>
  <rect x="220" y="146" width="220" height="36" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="330" y="162" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">bloco' (corpo do for)</text>
  <text x="330" y="175" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">break -> lFim | continue -> lIncr</text>

  <line x1="330" y1="182" x2="330" y2="204" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>

  <!-- Node 4: Increment (lIncr) -->
  <text x="208" y="224" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">lIncr:</text>
  <rect x="220" y="206" width="220" height="36" rx="2" fill="#ffffff" stroke="#334155" stroke-width="1.2"/>
  <text x="330" y="222" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="middle">inc' (passo)</text>
  <text x="330" y="235" font-family="monospace" font-size="9.5" fill="#475569" text-anchor="middle">iinc 1 1 ; goto lInicio</text>

  <!-- Back-edge from inc' to lInicio -->
  <path d="M 440 224 L 515 224 L 515 98 L 444 98" fill="none" stroke="#334155" stroke-width="1.2" marker-end="url(#arr)"/>
  <text x="524" y="164" font-family="monospace" font-size="10" fill="#334155">goto lInicio</text>

  <!-- False branch from cond' to lFim -->
  <path d="M 220 104 L 115 104 L 115 276 L 216 276" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="4,3" marker-end="url(#arr)"/>
  <text x="108" y="190" font-family="serif" font-style="italic" font-size="10.5" fill="#475569" text-anchor="end">falso (goto lFim)</text>

  <!-- Node 5: Exit (lFim) -->
  <text x="208" y="280" font-family="monospace" font-size="11" font-weight="700" fill="#0f172a" text-anchor="end">lFim:</text>
  <rect x="220" y="260" width="220" height="32" rx="2" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="330" y="280" font-family="monospace" font-size="10.5" fill="#0f172a" text-anchor="middle">instruções após o laço</text>
</svg>
